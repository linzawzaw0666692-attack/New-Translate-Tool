<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Recap Translator - Gemini 3.6 Flash</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pyidaungsu', 'Myanmar Text', sans-serif;
      background: linear-gradient(135deg, #1e1e2e, #2d2d44);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 24px;
      font-size: 14px;
    }
    .api-box {
      background: #2a2a3e;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .api-box label { font-size: 14px; color: #bbb; }
    .api-box input {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      background: #1e1e2e;
      border: 1px solid #444;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 14px;
    }
    .panel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .panel-grid { grid-template-columns: 1fr; }
    }
    .panel {
      background: #2a2a3e;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .panel-title {
      font-size: 16px;
      font-weight: bold;
      color: #ffd93d;
    }
    select {
      padding: 6px 12px;
      background: #1e1e2e;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    textarea {
      width: 100%;
      min-height: 350px;
      padding: 14px;
      background: #1a1a2a;
      border: 1px solid #3a3a4e;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 15px;
      line-height: 1.7;
      resize: vertical;
      font-family: inherit;
    }
    textarea:focus {
      outline: none;
      border-color: #ffd93d;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-translate {
      background: linear-gradient(90deg, #ff6b6b, #ffa94d);
      color: #fff;
    }
    .btn-translate:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
    }
    .btn-clear {
      background: #3a3a4e;
      color: #e0e0e0;
    }
    .btn-copy {
      background: #6bcb77;
      color: #1e1e2e;
      padding: 8px 16px;
      font-size: 13px;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }
    .status {
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
      min-height: 20px;
    }
    .status.loading { color: #ffd93d; }
    .status.error { color: #ff6b6b; }
    .status.success { color: #6bcb77; }
    .char-count {
      font-size: 12px;
      color: #777;
      text-align: right;
      margin-top: 6px;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #ffd93d;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 Movie Recap Translator</h1>
    <p class="subtitle">တရုတ် / အင်္ဂလိပ် စာသား → မြန်မာဘာသာပြန် | Gemini 3.6 Flash</p>

    <div class="api-box">
      <label>🔑 Gemini API Key:</label>
      <input type="password" id="apiKey" placeholder="AIza... သင့် API Key ထည့်ပါ">
      <button class="btn-copy" onclick="toggleKey()" id="toggleBtn">ပြရန်</button>
    </div>

    <div class="panel-grid">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">📥 မူရင်းစာသား</span>
          <select id="sourceLang">
            <option value="auto">Auto Detect</option>
            <option value="Chinese">တရုတ်</option>
            <option value="English">အင်္ဂလိပ်</option>
          </select>
        </div>
        <textarea id="sourceText" placeholder="ဒီနေရာမှာ တရုတ် သို့မဟုတ် အင်္ဂလိပ် စာသားကို paste လုပ်ပါ..."></textarea>
        <div class="char-count" id="sourceCount">0 လုံး</div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">📤 မြန်မာဘာသာပြန်</span>
          <button class="btn-copy" onclick="copyResult()">📋 Copy</button>
        </div>
        <textarea id="resultText" placeholder="ဘာသာပြန်ချက် ဒီနေရာမှာ ပေါ်လာပါမည်..." readonly></textarea>
        <div class="char-count" id="resultCount">0 လုံး</div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-translate" id="translateBtn" onclick="translateText()">🌐 မြန်မာလို ဘာသာပြန်မယ်</button>
      <button class="btn-clear" onclick="clearAll()">🗑️ ရှင်းမယ်</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script>
    const API_MODEL = 'gemini-3.5 flash -Lite';
    const API_BASE = 'https://generativelanguage.googleapis.com/v1beta/models';

    const sourceText = document.getElementById('sourceText');
    const resultText = document.getElementById('resultText');
    const statusEl = document.getElementById('status');
    const translateBtn = document.getElementById('translateBtn');
    const sourceCount = document.getElementById('sourceCount');
    const resultCount = document.getElementById('resultCount');
    const apiKeyInput = document.getElementById('apiKey');

    // localStorage မှာ API key သိမ်း
    apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
    apiKeyInput.addEventListener('input', () => {
      localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
    });

    sourceText.addEventListener('input', () => {
      sourceCount.textContent = sourceText.value.length + ' လုံး';
    });
    resultText.addEventListener('input', () => {
      resultCount.textContent = resultText.value.length + ' လုံး';
    });

    function toggleKey() {
      const inp = apiKeyInput;
      const btn = document.getElementById('toggleBtn');
      if (inp.type === 'password') {
        inp.type = 'text';
        btn.textContent = 'ဖျောက်ရန်';
      } else {
        inp.type = 'password';
        btn.textContent = 'ပြရန်';
      }
    }

    function setStatus(msg, type = '') {
      statusEl.className = 'status ' + type;
      statusEl.innerHTML = msg;
    }

    function clearAll() {
      sourceText.value = '';
      resultText.value = '';
      sourceCount.textContent = '0 လုံး';
      resultCount.textContent = '0 လုံး';
      setStatus('');
    }

    async function copyResult() {
      if (!resultText.value) return;
      try {
        await navigator.clipboard.writeText(resultText.value);
        setStatus('✅ Copy လုပ်ပြီးပါပြီ', 'success');
        setTimeout(() => setStatus(''), 2000);
      } catch (e) {
        setStatus('❌ Copy မလုပ်နိုင်ပါ', 'error');
      }
    }

    function buildPrompt(text, srcLang) {
      const langHint = srcLang === 'auto'
        ? 'မူရင်းစာသားသည် တရုတ် သို့မဟုတ် အင်္ဂလိပ် ဖြစ်နိုင်သည်။ ဘာသာစကားကို ကိုယ်တိုင်ခွဲခြားပါ။'
        : `မူရင်းဘာသာစကားသည် ${srcLang === 'Chinese' ? 'တရုတ်' : 'အင်္ဂလိပ်'} ဖြစ်သည်။`;

      return `သင်သည် Movie Recap ဗီဒီယိုများအတွက် ကျွမ်းကျင်သော ဘာသာပြန်သမားတစ်ဦးဖြစ်သည်။
${langHint}

အောက်ပါ မူရင်းစာသားကို သဘာဝကျသော မြန်မာဘာသာဖြင့် ဘာသာပြန်ပေးပါ။

လိုက်နာရမည့် အချက်များ:
1. Movie Recap ပုံစံနှင့် ကိုက်ညီအောင် သဘာဝကျကျ၊ စီးဆင်းမှုကောင်းမွန်စွာ ပြန်ဆိုပါ။
2. ဇာတ်ကောင်အမည်များ၊ နေရာအမည်များကို မူရင်းအတိုင်း (သို့) အသံထွက်နီးစပ်စွာ ထားပါ။
3. စကားပြောပုံစံ (dialogue) များကို သဘာဝကျသော မြန်မာစကားပြောပုံစံဖြင့် ပြန်ဆိုပါ။
4. မူရင်းအဓိပ္ပာယ် မပျောက်စေရန်၊ အကြောင်းအရာ မပြောင်းလဲစေရန်။
5. ဘာသာပြန်ချက်သာ ပြန်ပေးပါ။ ရှင်းလင်းချက် သို့မဟုတ် နိဒါန်း မထည့်ပါနှင့်။

မူရင်းစာသား:
"""
${text}
"""

မြန်မာဘာသာပြန်:`;
    }

    async function translateText() {
      const text = sourceText.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!apiKey) {
        setStatus('⚠️ Gemini API Key ထည့်ပါ', 'error');
        apiKeyInput.focus();
        return;
      }
      if (!text) {
        setStatus('⚠️ မူရင်းစာသား ထည့်ပါ', 'error');
        sourceText.focus();
        return;
      }

      const srcLang = document.getElementById('sourceLang').value;
      translateBtn.disabled = true;
      setStatus('<span class="spinner"></span> ဘာသာပြန်နေသည်...', 'loading');
      resultText.value = '';

      try {
        const url = `${API_BASE}/${API_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const prompt = buildPrompt(text, srcLang);

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: prompt }]
            }],
            generationConfig: {
              temperature: 0.7,
              topP: 0.95,
              topK: 40,
              maxOutputTokens: 8192
            }
          })
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          const msg = err?.error?.message || `HTTP ${response.status}`;
          throw new Error(msg);
        }

        const data = await response.json();
        const translated = data?.candidates?.[0]?.content?.parts
          ?.map(p => p.text || '')
          .join('')
          .trim();

        if (!translated) {
          throw new Error('ဘာသာပြန်ချက် မရရှိပါ');
        }

        resultText.value = translated;
        resultCount.textContent = translated.length + ' လုံး';
        setStatus('✅ ဘာသာပြန် ပြီးပါပြီ', 'success');

      } catch (error) {
        console.error(error);
        setStatus('❌ Error: ' + error.message, 'error');
      } finally {
        translateBtn.disabled = false;
      }
    }

    // Ctrl+Enter ဖြင့် translate
    sourceText.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        translateText();
      }
    });
  </script>
</body>
</html>
